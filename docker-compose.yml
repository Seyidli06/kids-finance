services:
  postgres:
    image: postgres:17-alpine
    container_name: kids_finance_postgres

    environment:
      POSTGRES_DB: kids_finance
      POSTGRES_USER: kids_finance
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kids_finance -d kids_finance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: